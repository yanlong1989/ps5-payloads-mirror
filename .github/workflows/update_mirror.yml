name: Hourly Payloads Mirror

on:
  schedule:
    - cron: '17 * * * *' # Hourly, away from the top-of-hour queue.
  workflow_dispatch:
    inputs:
      payload:
        description: 'Optional exact payload name; leave empty for a full sync'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'update_payloads.py'
      - 'add_payload.py'
      - 'payloads.json'
      - 'tests/**'
      - '.github/workflows/update_mirror.yml'

permissions:
  contents: read

concurrency:
  group: payload-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-mirror:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify end-to-end behavior
        run: python tests/e2e_mirror.py

      - name: Restore release API cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/
          key: release-api-${{ runner.os }}-${{ hashFiles('update_payloads.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-api-${{ runner.os }}-${{ hashFiles('update_payloads.py') }}-

      - name: Download, verify, and publish changed payloads
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_NAME: ${{ inputs.payload }}
          MIRROR_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=(--publish)
          if [[ -n "$PAYLOAD_NAME" ]]; then
            args+=("$PAYLOAD_NAME")
          fi
          python update_payloads.py "${args[@]}"

      - name: Commit successfully published metadata
        if: always() && steps.sync.outcome != 'skipped'
        env:
          MIRROR_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads.json README.md
          for metadata in SHA256SUMS mirror-health.json; do
            if [[ -f "$metadata" ]]; then
              git add "$metadata"
            fi
          done
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Update verified payload mirror"
            git push origin "HEAD:$MIRROR_BRANCH"
          fi

      - name: Remove obsolete automated Release assets
        if: success() && steps.sync.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_BRANCH: ${{ github.event.repository.default_branch }}
        run: python update_payloads.py --prune

      - name: Save release API cache
        if: always() && steps.sync.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/
          key: release-api-${{ runner.os }}-${{ hashFiles('update_payloads.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save sync and end-to-end evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirror-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Report upstream or publication failures
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo "At least one payload failed. Previously valid metadata was retained; see the evidence artifact."
          exit 1
